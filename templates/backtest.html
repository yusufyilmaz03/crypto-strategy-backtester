<!-- templates/backtest.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Backtest Comparison</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { padding: 16px; }
    .table-wrap { max-height: 50vh; overflow: auto; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <h3 class="mb-3">Backtest Comparison</h3>

    <a href="/" class="btn btn-secondary mb-3">⬅ Back</a>

    <!-- Filters -->
    <div class="row g-2 mb-3">
      <div class="col-12 col-md-2">
        <label class="form-label">Segment</label>
        <select id="segmentFilter" class="form-select"></select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Strategy</label>
        <select id="strategyFilter" class="form-select" multiple></select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Symbol</label>
        <select id="symbolFilter" class="form-select" multiple></select>
      </div>
      <div class="col-12 col-md-2">
        <label class="form-label">Timeframe</label>
        <select id="tfFilter" class="form-select" multiple></select>
      </div>
      <div class="col-12 col-md-2 d-flex align-items-end gap-2">
        <button id="applyBtn" class="btn btn-primary w-100">Apply</button>
        <button id="clearBtn" class="btn btn-secondary">Clear</button>
      </div>
    </div>

    <!-- Chart mode -->
    <div class="d-flex align-items-center gap-2 mb-2">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="aggSwitch" />
        <label class="form-check-label" for="aggSwitch">
          Aggregate (median return per strategy)
        </label>
      </div>
    </div>

    <!-- Chart -->
    <div class="card mb-3">
      <div class="card-body">
        <canvas id="pnlChart" height="120"></canvas>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="card-body">
        <div class="table-wrap">
          <table class="table table-sm table-striped align-middle" id="backtestTable">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Timeframe</th>
                <th>Strategy</th>
                <th>Segment</th>
                <th>Return%</th>
                <th>BuyHold%</th>
                <th>Trades</th>
                <th>WinRate%</th>
                <th>ProfitFactor</th>
                <th>MaxDD%</th>
                <th>Sharpe</th>
                <th>Exposure%</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="text-end mt-2">
          <a class="btn btn-outline-secondary btn-sm" href="/api/backtest" target="_blank">JSON</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let rawData = [];
    let chart;
    const $ = (q) => document.querySelector(q);
    const $$ = (q) => Array.from(document.querySelectorAll(q));

    async function loadData() {
      const res = await fetch("/api/backtest");
      const js = await res.json();
      rawData = js.results || [];
      populateFilters();
      render();
    }

    function uniq(arr) {
      return [...new Set(arr.filter(x => x !== null && x !== undefined && x !== ""))];
    }

    function populateFilters() {
      const strategies = uniq(rawData.map(r => r.Strategy));
      const symbols = uniq(rawData.map(r => r.Symbol));
      const tfs = uniq(rawData.map(r => r.Timeframe));

      const segments = uniq(rawData.map(r => r.Segment));
      fillSelect($("#segmentFilter"), segments);
      $("#segmentFilter").value = segments.includes("OOS") ? "OOS" : segments[0];
      fillSelect($("#strategyFilter"), strategies);
      fillSelect($("#symbolFilter"), symbols);
      fillSelect($("#tfFilter"), tfs);
    }

    function fillSelect(sel, items) {
      sel.innerHTML = "";
      items.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      });
    }

    function getSelectedValues(sel) {
      return Array.from(sel.selectedOptions).map(o => o.value);
    }

    function applyFilters(data) {
      const sSel = getSelectedValues($("#strategyFilter"));
      const symSel = getSelectedValues($("#symbolFilter"));
      const tfSel = getSelectedValues($("#tfFilter"));
      const seg = $("#segmentFilter").value;
      return data.filter(r => {
        if (r.Segment !== seg) return false;
        const a = (sSel.length === 0 || sSel.includes(r.Strategy));
        const b = (symSel.length === 0 || symSel.includes(r.Symbol));
        const c = (tfSel.length === 0 || tfSel.includes(r.Timeframe));
        return a && b && c;
      });
    }

    function render() {
      const filtered = applyFilters(rawData);
      renderTable(filtered);
      renderChart(filtered, $("#aggSwitch").checked);
    }

    function renderTable(rows) {
      const tb = $("#backtestTable tbody");
      tb.innerHTML = "";
      rows.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.Symbol ?? ""}</td>
          <td>${r.Timeframe ?? ""}</td>
          <td>${r.Strategy ?? ""}</td>
          <td>${r.Segment ?? ""}</td>
          <td>${fmtNum(r["Return%"])}</td>
          <td>${fmtNum(r["BuyHold%"])}</td>
          <td>${fmtNum(r.Trades, 0)}</td>
          <td>${fmtNum(r["WinRate%"])}</td>
          <td>${r.ProfitFactor === null && r.Trades > 0 ? "∞" : fmtNum(r.ProfitFactor)}</td>
          <td>${fmtNum(r["MaxDD%"])}</td>
          <td>${fmtNum(r.Sharpe)}</td>
          <td>${fmtNum(r["Exposure%"])}</td>
        `;
        tb.appendChild(tr);
      });
    }

    function fmtNum(v, digits = 2) {
      if (v === null || v === undefined || Number.isNaN(+v)) return "";
      return (+v).toFixed(digits);
    }

    function renderChart(rows, aggregateMode) {
      const ctx = $("#pnlChart").getContext("2d");
      if (chart) chart.destroy();

      if (aggregateMode) {
        // Aggregate: median Return% per strategy
        const byStrat = {};
        rows.forEach(r => {
          const k = r.Strategy || "N/A";
          (byStrat[k] = byStrat[k] || []).push(+r["Return%"] || 0);
        });
        const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
                              return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
        const labels = Object.keys(byStrat);
        const data = labels.map(k => median(byStrat[k]));
        chart = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [{ label: "Median Return%", data }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: true } },
            scales: { y: { beginAtZero: true } }
          }
        });
      } else {
        // Detail: one bar per row
        const labels = rows.map(r => `${r.Symbol} • ${r.Timeframe} • ${r.Strategy}`);
        const data = rows.map(r => +r["Return%"] || 0);
        chart = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [{ label: "Return%", data }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: true } },
            scales: { y: { beginAtZero: true } }
          }
        });
      }
    }

    $("#applyBtn").addEventListener("click", render);
    $("#clearBtn").addEventListener("click", () => {
      $$("#strategyFilter option, #symbolFilter option, #tfFilter option").forEach(o => o.selected = false);
      render();
    });
    $("#aggSwitch").addEventListener("change", render);
    $("#segmentFilter").addEventListener("change", render);

    loadData();
  </script>
</body>
</html>
