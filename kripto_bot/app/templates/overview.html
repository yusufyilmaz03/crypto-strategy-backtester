{% extends "base.html" %}
{% block title %}Overview{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Overview</h1>
  <a class="btn btn-primary btn-sm" href="/instances#new"><i class="bi bi-plus-lg"></i> New instance</a>
</div>

<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="card h-100"><div class="card-body">
    <div class="d-flex justify-content-between"><h6 class="card-title mb-1">Supervisor</h6><span id="sup-badge"></span></div>
    <p class="small text-secondary mb-0" id="sup-text">…</p>
  </div></div></div>
  <div class="col-md-4"><div class="card h-100"><div class="card-body">
    <div class="d-flex justify-content-between"><h6 class="card-title mb-1">Kill switch <small class="text-secondary">(testnet / live)</small></h6><span id="kill-badge"></span></div>
    <div class="btn-group btn-group-sm mt-2" role="group">
      <button class="btn btn-outline-success" onclick="kill('off')">Off</button>
      <button class="btn btn-outline-warning" onclick="kill('block')" title="No new entries">Block entries</button>
      <button class="btn btn-outline-danger" onclick="kill('flatten')" title="Close every position">Flatten</button>
    </div>
  </div></div></div>
  <div class="col-md-4"><div class="card h-100"><div class="card-body">
    <h6 class="card-title mb-1">Order execution</h6>
    <p class="small mb-0" id="mode-text">…</p>
  </div></div></div>
</div>

<h2 class="h5 mb-3">Instances</h2>
<div class="row g-3" id="cards"></div>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const d = await KB.api("/api/overview");
  const sup = d.supervisor;
  document.getElementById("sup-badge").innerHTML = sup.running
    ? '<span class="badge text-bg-success">running</span>' : '<span class="badge text-bg-warning">not running</span>';
  document.getElementById("sup-text").innerHTML = sup.running
    ? `Keeping enabled instances running (pid ${sup.pid}).`
    : 'Start it with <code>python -m kripto_bot run</code>: it runs every enabled instance and restarts them if they crash.';
  const k = { off: ["success", "off"], block: ["warning", "entries blocked"], flatten: ["danger", "flattening"] }[d.kill_switch];
  document.getElementById("kill-badge").innerHTML = `<span class="badge text-bg-${k[0]}">${k[1]}</span>`;
  document.getElementById("mode-text").innerHTML =
    `Mode <b>${KB.esc(d.trading_mode)}</b> · live trading ${d.live_enabled
      ? '<span class="badge text-bg-danger">ENABLED</span>' : '<span class="badge text-bg-secondary"><i class="bi bi-lock"></i> locked</span>'}
     <br><span class="text-secondary">Live trading can only be enabled in config.py.</span>`;

  const cards = document.getElementById("cards");
  KB.disposeTips(cards);
  cards.innerHTML = d.instances.map(i => {
    const s = i.summary;
    const setup = [i.strategy, KB.params(i.params), i.timeframe, `stop ${i.stop}`, i.trail && `trail ${i.trail}×ATR`,
                   i.sizing !== "equal" && `${i.sizing} sizing`, i.lower_tf_entry && "lower-TF entry",
                   i.lower_tf_exit && "lower-TF exit", i.manual_close && "manual close", `${i.symbols.length} symbols`]
      .filter(Boolean).join(" · ");
    const about = KB.esc(setup) + (i.description ? `<br>${KB.esc(i.description)}` : "");
    return `<div class="col-md-6 col-xl-4"><a class="text-decoration-none" href="/instances/${encodeURIComponent(i.name)}">
      <div class="card card-instance h-100"><div class="card-body">
        <div class="d-flex justify-content-between mb-3"><h6 class="mb-0 text-body">${KB.esc(i.name)}
          <i class="bi bi-exclamation-circle text-secondary small ms-1" data-bs-toggle="tooltip" data-bs-html="true"
             data-bs-title="${KB.esc(about)}"></i></h6>
          <span>${KB.modeBadge(i.mode)} ${KB.statusBadge(i.status, i.enabled)}</span></div>
        <div class="metrics-row">
          <div class="metric"><div class="label">Max DD</div><div class="value">${KB.num(s.max_dd_pct, 1)}%</div></div>
          <div class="metric"><div class="label">Buy &amp; hold</div><div class="value ${KB.sign(s.buy_hold_pct)}">${KB.pct(s.buy_hold_pct)}</div></div>
          <div class="metric"><div class="label">Realized PnL</div><div class="value ${KB.sign(s.realized_pnl)}"
            title="from closed trades, USDT">${KB.num(s.realized_pnl)}</div></div>
          <div class="metric"><div class="label">Return</div><div class="value ${KB.sign(s.return_pct)}">${KB.pct(s.return_pct)}</div></div>
        </div>
        <div class="small text-secondary mt-2">${s.days} days · ${s.closed_trades} closed trades · ${s.open_positions} open</div>
      </div></div></a></div>`;
  }).join("") || '<p class="text-secondary">No instances yet.</p>';
  KB.initTips(cards);
}
async function kill(mode) {
  if (mode === "flatten" && !confirmFlatten()) return;
  try { await KB.api("/api/kill-switch", { method: "POST", body: { mode } }); KB.toast(`Kill switch: ${mode}`); load(); }
  catch (e) { KB.toast(e.message, "danger"); }
}
let flattenArmed = 0;
function confirmFlatten() {   // two clicks within 5s instead of a blocking dialog
  if (Date.now() - flattenArmed < 5000) return true;
  flattenArmed = Date.now();
  KB.toast("Click Flatten again within 5 seconds to close every testnet/live position.", "warning");
  return false;
}
load(); setInterval(load, 10000);
</script>
{% endblock %}
