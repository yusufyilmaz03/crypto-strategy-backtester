{% extends "base.html" %}
{% block title %}Overview{% endblock %}
{% block head %}
<style>
  #sort { width: auto; }
  /* Narrow screens: drop the hidden-count note so the switch and the sort select share
     the row; once the select wraps to its own line it takes the full width. */
  @media (max-width: 599.98px) { #hidden-note { display: none; } }
  @media (max-width: 467.98px) { #sort { flex: 1 1 100%; width: 100%; } }
</style>
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Overview</h1>
  <a class="btn btn-primary btn-sm" href="/instances#new"><i class="bi bi-plus-lg"></i> New instance</a>
</div>

<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="card h-100"><div class="card-body">
    <div class="d-flex justify-content-between align-items-start gap-2"><h6 class="card-title mb-1">Supervisor</h6><span id="sup-badge"></span></div>
    <p class="small text-secondary mb-0" id="sup-text">…</p>
  </div></div></div>
  <div class="col-md-4"><div class="card h-100"><div class="card-body">
    <div class="d-flex justify-content-between align-items-start gap-2"><h6 class="card-title mb-1">Kill switch <small class="text-secondary">(testnet / live)</small></h6><span id="kill-badge"></span></div>
    <div class="btn-group btn-group-sm mt-2" role="group">
      <button class="btn btn-outline-success" onclick="kill('off')">Off</button>
      <button class="btn btn-outline-warning" onclick="kill('block')" title="No new entries">Block entries</button>
      <button class="btn btn-outline-danger" onclick="kill('flatten')" title="Close every position">Flatten</button>
    </div>
  </div></div></div>
  <div class="col-md-4"><div class="card h-100"><div class="card-body">
    <h6 class="card-title mb-1">Order execution</h6>
    <p class="small mb-0" id="mode-text">…</p>
  </div></div></div>
</div>

<div class="d-flex align-items-center flex-wrap gap-3 mb-3">
  <h2 class="h5 mb-0">Instances</h2>
  <div class="form-check form-switch mb-0">
    <input class="form-check-input" type="checkbox" role="switch" id="show-stopped">
    <label class="form-check-label small" for="show-stopped">Show stopped</label>
  </div>
  <span class="small text-secondary" id="hidden-note"></span>
  <select class="form-select form-select-sm ms-auto" id="sort" aria-label="Sort instances"></select>
</div>
<div class="row g-3" id="cards"></div>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const d = await KB.api("/api/overview");
  const sup = d.supervisor;
  document.getElementById("sup-badge").innerHTML = sup.running
    ? '<span class="badge text-bg-success">running</span>' : '<span class="badge text-bg-warning">not running</span>';
  document.getElementById("sup-text").innerHTML = sup.running
    ? `Keeping enabled instances running (pid ${sup.pid}).`
    : 'Start it with <code>python -m kripto_bot run</code>: it runs every enabled instance and restarts them if they crash.';
  const k = { off: ["success", "off"], block: ["warning", "entries blocked"], flatten: ["danger", "flattening"] }[d.kill_switch];
  document.getElementById("kill-badge").innerHTML = `<span class="badge text-bg-${k[0]}">${k[1]}</span>`;
  document.getElementById("mode-text").innerHTML =
    `Mode <b>${KB.esc(d.trading_mode)}</b> · live trading ${d.live_enabled
      ? '<span class="badge text-bg-danger">ENABLED</span>' : '<span class="badge text-bg-secondary"><i class="bi bi-lock"></i> locked</span>'}
     <br><span class="text-secondary">Live trading can only be enabled in config.py.</span>`;

  const cards = document.getElementById("cards");
  KB.disposeTips(cards);
  const showStopped = document.getElementById("show-stopped").checked;
  const shown = sortInstances(d.instances.filter(i => showStopped || i.enabled));
  const hidden = d.instances.length - shown.length;
  document.getElementById("hidden-note").textContent = hidden ? `${hidden} stopped hidden` : "";
  cards.innerHTML = shown.map(i => {
    const s = i.summary;
    const setup = [i.strategy, KB.params(i.params), i.timeframe, `stop ${i.stop}`, i.trail && `trail ${i.trail}×ATR`,
                   i.sizing !== "equal" && `${i.sizing} sizing`, i.trend_sma && `trend SMA${i.trend_sma}`,
                   i.lower_tf_entry && "lower-TF entry", i.lower_tf_exit && "lower-TF exit",
                   i.lower_tf_sma && `lower-TF SMA${i.lower_tf_sma}`, i.manual_close && "manual close",
                   `${i.symbols.length} symbols`]
      .filter(Boolean).join(" · ");
    const about = KB.esc(setup) + (i.description ? `<br>${KB.esc(i.description)}` : "");
    return `<div class="col-md-6 col-xl-4"><a class="text-decoration-none" href="/instances/${encodeURIComponent(i.name)}">
      <div class="card card-instance h-100"><div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-3"><h6 class="mb-0 text-body text-break">${KB.star(i)} ${KB.esc(i.name)}
          <i class="bi bi-exclamation-circle text-secondary small ms-1" data-bs-toggle="tooltip" data-bs-html="true"
             data-bs-title="${KB.esc(about)}"></i></h6>
          <span class="text-nowrap">${KB.modeBadge(i.mode)} ${KB.statusBadge(i.status, i.enabled)}</span></div>
        <div class="card-metrics">
          <div class="metric"><div class="label">Max DD</div><div class="value">${s.max_dd_pct == null ? "–" : KB.num(s.max_dd_pct, 1) + "%"}</div></div>
          <div class="metric"><div class="label">${KB.term("Buy &amp; hold", KB.BH_TIP)}</div><div class="value ${KB.sign(s.buy_hold_pct)}">${KB.pct(s.buy_hold_pct)}</div></div>
          <div class="metric"><div class="label">Realized PnL</div><div class="value ${KB.sign(s.realized_pnl)}"
            title="from closed trades, USDT">${KB.money(s.realized_pnl)}</div></div>
          <div class="metric"><div class="label">Return</div><div class="value ${KB.sign(s.return_pct)}">${KB.pct(s.return_pct)}</div></div>
        </div>
        <div class="small text-secondary mt-auto pt-3">${s.days} days · ${s.closed_trades} closed trades · ${s.open_positions} open</div>
      </div></div></a></div>`;
  }).join("") || `<p class="text-secondary">${d.instances.length ? "No running instances. Turn on Show stopped to see the others." : "No instances yet."}</p>`;
  KB.initTips(cards);
}
async function kill(mode) {
  if (mode === "flatten" && !confirmFlatten()) return;
  try { await KB.api("/api/kill-switch", { method: "POST", body: { mode } }); KB.toast(`Kill switch: ${mode}`); load(); }
  catch (e) { KB.toast(e.message, "danger"); }
}
let flattenArmed = 0;
function confirmFlatten() {   // two clicks within 5s instead of a blocking dialog
  if (Date.now() - flattenArmed < 5000) return true;
  flattenArmed = Date.now();
  KB.toast("Click Flatten again within 5 seconds to close every testnet/live position.", "warning");
  return false;
}
// Sort options: [label, value of an instance, direction]. Instances without a value (no data
// yet) go last. Favorites are sorted like the others; their star marks them.
const SORTS = {
  newest: ["Newest first", i => i.created_at, -1],
  oldest: ["Oldest first", i => i.created_at, 1],
  pnl: ["Highest realized PnL", i => i.summary.realized_pnl, -1],
  return: ["Highest return %", i => i.summary.return_pct, -1],
  sharpe: ["Highest Sharpe", i => i.summary.sharpe, -1],
  drawdown: ["Lowest max drawdown", i => i.summary.max_dd_pct, 1],
  winrate: ["Highest win rate", i => i.summary.win_rate_pct, -1],
  trades: ["Most closed trades", i => i.summary.closed_trades, -1],
  name: ["Name A–Z", i => i.name.toLowerCase(), 1],
};
function sortInstances(rows) {
  const [, key, dir] = SORTS[document.getElementById("sort").value] || SORTS.newest;
  const cmp = (x, y) => x == null || y == null ? (x == null) - (y == null) : (x < y ? -1 : x > y ? 1 : 0) * dir;
  return [...rows].sort((a, b) => cmp(key(a), key(b)));
}
const SORT_KEY = "kb-overview-sort", sortEl = document.getElementById("sort");
sortEl.innerHTML = Object.entries(SORTS).map(([k, [label]]) => `<option value="${k}">${label}</option>`).join("");
try { if (SORTS[localStorage.getItem(SORT_KEY)]) sortEl.value = localStorage.getItem(SORT_KEY); } catch (e) {}
sortEl.addEventListener("change", () => {
  try { localStorage.setItem(SORT_KEY, sortEl.value); } catch (e) {}
  load();
});

// The switch is a per-browser preference: off (only running instances) unless turned on here.
const SHOW_KEY = "kb-show-stopped";
try { document.getElementById("show-stopped").checked = localStorage.getItem(SHOW_KEY) === "1"; } catch (e) {}
document.getElementById("show-stopped").addEventListener("change", e => {
  try { localStorage.setItem(SHOW_KEY, e.target.checked ? "1" : "0"); } catch (err) {}
  load();
});
window.addEventListener("kb-favorite", load);
load(); setInterval(load, 10000);
</script>
{% endblock %}
